name: Render and deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

# Write access lets the job publish the PDF to the 'Latest PDF' release.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        # Pinned: 1.5.57 failed PDF builds elsewhere in the series;
        # 1.10.18 matches local builds.
        with:
          version: '1.10.18'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::digest
            any::ggplot2
            any::dplyr
            any::tibble
            any::tidyr
            any::readr
            any::purrr

      # TeX for the PDF edition; Quarto installs any missing LaTeX
      # packages on demand during the render.
      - name: Install TinyTeX
        run: quarto install tinytex --no-prompt

      # One render for all formats: separate --to html and --to pdf
      # runs each clear _book, and Quarto adds the sidebar 'Download
      # PDF' link only when it builds the PDF in the same run.
      - name: Render book
        run: quarto render analysis/report

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./analysis/report/_book
          production-branch: main
          production-deploy: true
          deploy-message: 'GHA: ${{ github.event.head_commit.message }}'
          enable-pull-request-comment: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      # One rolling release holds the current PDF, so the download
      # link on the repository page never changes.
      - name: Publish PDF to the 'Latest PDF' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pdf=$(ls analysis/report/_book/*.pdf 2>/dev/null | head -1)
          if [ -z "$pdf" ]; then echo "No PDF was built"; exit 1; fi
          repo="$GITHUB_REPOSITORY"
          if ! gh release view latest-pdf --repo "$repo" >/dev/null 2>&1; then
            gh release create latest-pdf --repo "$repo" --target main \
              --title 'Latest PDF' --prerelease --notes 'Created by CI.'
          fi
          gh release upload latest-pdf "$pdf" --repo "$repo" --clobber
          gh release edit latest-pdf --repo "$repo" --notes \
            "Draft PDF built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). The same file is served at the book's website."
