[build]
  publish = "analysis/book/_book"
  command = "quarto render analysis/book"

[build.environment]
  QUARTO_VERSION = "1.5.57"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
